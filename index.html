<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website voor contact met onze wagen</title>
  <style>
    iframe {
      box-shadow: 0 0 15px #00bcd4;
      width: 80%;
      max-width: 800px;
      height: 80%;
      max-height: 720px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      border: 4px solid #00bcd4;
      border-radius: 10px;
    }
    body {
      margin: 0;
      height: 100vh;
      background-color: #f0f0f0;
      background-image: url('background.jpg');
      background-size: cover;
      font-family: Arial, sans-serif;
    }

    /* een lege vierkant waar de camerabeeld komt */
    #vierkant {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 300px;
      height: 300px;
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 5px;
      z-index: 100;
    }
    

    /* het titel van ons project*/
    .rechthoek {
      position: fixed;
      top: 340px;
      left: 20px;
      width: 300px;
      height: 80px;
      background-color: rgba(0, 0, 0, 0.6);
      border-radius: 5px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 10px;
      box-sizing: border-box;
    }

    .rechthoek h1 {
      margin: 5px 0;
      font-size: 18px;
      text-align: center;
    }

    .rechthoek .titel {
      font-weight: bold;
    }

    .rechthoek .groepnaam {
      font-size: 22px;
      color: #4CAF50;
    }

    .kul-logo {
      position: fixed;
      top: 425px;
      left: 20px;
      width: 300px;
      height: auto;
      z-index: 100;
    }

    .kul-logo img {
      width: 100%;
      height: auto;
      max-height: 100px;
    }

    /* Timer blok linksonder */
    .timer-container {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 15px;
      border-radius: 5px;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 220px;
      z-index: 100;
    }

    .timer-container input {
      width: 120px;
      padding: 8px;
      border-radius: 4px;
      border: none;
      text-align: center;
    }

    .timer-buttons {
      display: flex;
      gap: 10px;
    }

    .timer-container button {
      padding: 8px 15px;
      border: none;
      border-radius: 4px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }

    .timer-container button:hover {
      background-color: #45a049;
    }

    #timer {
  
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }

    /* Connectie button rechtsboven */
    .connectie-container {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }

    #connect-btn {
      width: 80px;
      height: 80px;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
      transition: transform 0.2s;
    }

    #connect-btn:hover {
      transform: scale(1.1);
    }

    #connect-btn:active {
      transform: scale(0.95);
    }

    #connect-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .status-container {
      background-color: rgba(0,0,0,0.6);
      color: rgb(255, 255, 255);
      border-radius: 5px;
      padding: 8px 12px;
      text-align: center;
      font-size: 14px;
    }

    /* game over button */
    #noodknop {
      position: fixed;
      bottom: 35px;
      left: 1050px;
      width: 200px;
      height: 60px;
      border: none;
      border-radius: 30%;
      background: none;
      cursor: pointer;
      padding: 0;
      transition: transform 0.2s;
      z-index: 100;
    }

    #noodknop:hover {
      transform: scale(1.1);
    }

    #noodknop:active {
      transform: scale(0.95);
    }

    #noodknop img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Besturingsknoppen */
    #controls {
      position: fixed;
      bottom: 20px;
      right: 30px;
      display: grid;
      grid-template-columns: (1fr,1fr,1fr);
      grid-template-rows: (1fr,1fr);
      gap: 12px;
      z-index: 100;
    }

    .control-button {
      width: 65px;
      height: 65px;
      border: none;
      background: rgba(0, 0, 0, 0.5);
      cursor: pointer;
      padding: 0;
      transition: all 0.2s;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .control-button:hover {
      background: rgba(0, 0, 0, 0.7);
      transform: scale(1.1);
    }

    .control-button:active {
      transform: scale(0.95);
    }

    .control-button img {
      width: 70%;
      height: 70%;
      object-fit: contain;
    }

    #button_vooruit {
      grid-column: 2;
      grid-row: 1;
    }

    #button_links {
      grid-column: 1;
      grid-row: 2;
    }

    #button_achteruit {
      grid-column: 2;
      grid-row: 2;
    }

    #button_rechts {
      grid-column: 3;
      grid-row: 2;
    }
    
  </style>
</head>
<body>
  <!-- Vierkant linksboven (nu leeg) -->
  <div id="vierkant"></div>

  <!-- Rechthoek onder het vierkant met titels -->
  <div class="rechthoek">
    <h1 class="titel">Actuele stand van het spel</h1>
    <h1 class="groepnaam">Team 407</h1>
  </div>

  <!-- Timer container linksonder -->
  <div class="timer-container">
    <input type="number" min="1" id="timeInput" placeholder="Tijd in sec">
    <div class="timer-buttons">
      <button onclick="sendCommand('Start')" id="startTimerBtn">Start</button>
      <button onclick="sendCommand('Stop')" id="stopTimerBtn">Stop</button>
      <button onclick="sendCommand('Restart')" id="restartTimerBtn">Restart</button>
    </div>
    <h3 id="timer">00:00</h3>
  </div>

  <!-- Connectie container rechtsboven -->
  <div class="connectie-container">
    <button id="connect-btn" onclick="connect_socket()">
      <img src="connect_button.png" alt="Connect">
    </button>
    <h4 id="status">Status: Disconnected</h4> 
  </div>

  <div class="kul-logo">
    <img src="KUL.png" alt="KU Leuven Logo">
  </div>

  <!-- Noodknop -->
  <button id="noodknop" onclick = "sendCommand('Noodknop')">
    <img src="noodknop.png" alt="Noodknop">
  </button>

  <!-- Besturingsknoppen rechtsonder -->
  <div id="controls">
    <button id="button_links" class="control-button" onclick="sendCommand('Links')">
      <img src="button_links.png" alt="Links">
    </button>
    <button id="button_vooruit" class="control-button" onclick="sendCommand('Vooruit')">
      <img src="button_vooruit.png" alt="Vooruit">
    </button>
    <button id="button_achteruit" class="control-button" onclick="sendCommand('Achteruit')">
      <img src="button_achteruit.png" alt="Achteruit">
    </button>
    <button id="button_rechts" class="control-button" onclick="sendCommand('Rechts')">
      <img src="button_rechts.png" alt="Rechts">
    </button>
  </div>
  <!-- Camera -->
    <!-- Twitch livestream hier: -->
 
  <iframe
    src="https://www.twitch.tv/jonnyye06"
 
    allowfullscreen>
  </iframe>


  
 


  <script>
    // Timer functionaliteit
    document.addEventListener("DOMContentLoaded", function() {
      var timerElement = document.getElementById("timer");
      var timeInput = document.getElementById("timeInput");
      var startButton = document.getElementById("startTimerBtn");
      var stopButton = document.getElementById("stopTimerBtn");
      var restartButton = document.getElementById("restartTimerBtn");

      var timer;
      var timeLeft = 0;
      var isRunning = false;

      startButton.addEventListener("click", startTimer);
      stopButton.addEventListener("click", stopTimer);
      restartButton.addEventListener("click", restartTimer);

      function startTimer() {
        if (isRunning) return;

        if (!socket || socket.readyState !== WebSocket.OPEN) {
          alert("Niet verbonden met de PICO! Verbind eerst.");
          return;
        }
        
        if (timeLeft === 0) {
          var startTime = parseInt(timeInput.value);
          if (!isNaN(startTime) && startTime > 0) {
            timeLeft = startTime;
          } else {
            alert("Hoe lang mag onze wagen rijden? (in seconden)");
            return;
          }
        }

        sendCommand("Start");
        updateDisplay();
        clearInterval(timer);
        timer = setInterval(runTimer, 1000);
        isRunning = true;
      };

      function runTimer() {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          clearInterval(timer);
          isRunning = false;
          timerElement.innerHTML = "Tijd is om!"
          sendCommand("Stop");
        }
      }
    
      function stopTimer() {
        clearInterval(timer);
        isRunning = false;
        sendCommand("Stop")
      }

      function restartTimer() {
        stopTimer();
        timeLeft = parseInt(timeInput.value) || 0;

        if (timeLeft <= 0 || isNaN(timeLeft)) {
          alert ( "Voer een geldige tijd in!");
          return;
        }

        updateDisplay();
      }
      
      function updateDisplay() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerElement.innerHTML = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }
    });
    //toetsenbord controller
    document.addEventListener("keydown", function(event) {
        if (event.key === "ArrowUp") {
            sendCommand("Vooruit");  // Auto vooruit (↑)
        } else if (event.key === "ArrowDown") {
            sendCommand("Achteruit");  // Auto achteruit (↓)
        } else if (event.key === "ArrowLeft") {
            sendCommand("Links");  // Auto naar links (←)
        } else if (event.key === "ArrowRight") {
            sendCommand("Rechts");  // Auto naar rechts (→)
        } else if (event.key === " ") {
            sendCommand("Noodknop");  // Spatiebalk = STOP!
        }
    });
    let socket = undefined;

    function connect_socket() {
      disconnect_socket();

      socket = new WebSocket("ws://192.168.4.1:80/connect-websocket");

      socket.addEventListener("open", (event) => {
        document.getElementById("status").textContent = "Status: Connected";
        document.getElementById("connect-btn").innerHTML = '<img src="connected_button.png" alt="Connected">';
      });

      socket.addEventListener("close", (event) => {
        socket = undefined;
        document.getElementById("status").textContent = "Status: Disconnected";
        document.getElementById("connect-btn").innerHTML = '<img src="connect_button.png" alt="Connect">';
      });

      socket.addEventListener("message", (event) => {
        console.log(event.data);
      });

      socket.addEventListener("error", (event) => {
        socket = undefined;
        document.getElementById("status").textContent = "Status: Disconnected";
        document.getElementById("connect-btn").innerHTML = '<img src="connect_error.png" alt="Retry">';
      });
    }

function disconnect_socket() {
    if(socket != undefined) {
        socket.close();
    }
}

function sendCommand(command) {
    if(socket != undefined) {
        socket.send(command)
    } else {
        alert("Not connected to the PICO")
    }
}





  </script>
</body>
</html>
